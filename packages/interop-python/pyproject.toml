[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "johnhenry-math-plus-interop"
version = "0.0.1"
description = "Python-side interop helpers for math-plus: Arrow IPC / Parquet / .npy-.npz round-trips with pandas/NumPy (issue #21)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Minimum bounds for the published package's own dependents; the CONFORMANCE
# TEST SUITE pins exact versions (pyarrow==20.0.0, pandas==2.3.1) matching
# docs/spikes/arrow-parity.md's/parquet-bakeoff.md's pinned spike versions,
# via a nix-provisioned Python env (see tests/README.md) -- pinning the
# library's own install_requires to exact versions would be unusual for a
# library and would fight every consumer's own dependency resolution.
dependencies = [
    "pyarrow>=18.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[project.urls]
Repository = "https://github.com/johnhenry/math-plus"
Homepage = "https://github.com/johnhenry/math-plus/tree/main/packages/interop-python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[package]
name = "tensor-wasm-kernels"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Not enabled in the shipped build (issue #13) -- see lib.rs's simd module
# doc comment for why. Any wasm32 v128 instruction anywhere in a compiled
# module makes the WHOLE module fail WebAssembly validation on a runtime
# without SIMD support (module loading is all-or-nothing, unlike native
# code's per-call feature detection), so this can only ever ship as a
# SEPARATE .wasm artifact with its own runtime feature-detection dispatch
# on the JS side -- real, ongoing complexity (risk #7 in docs/PLAN.md).
# `--features simd` is for measurement builds only until/unless a real
# speedup justifies paying that cost.
simd = []

name: Release

# Multi-package sibling of johnhenry/mallory's single-package publish.yml.
# Same deployment substrate (GitHub Actions + the NPM_TOKEN secret), but
# driven by Changesets because this repo publishes ~11 independently
# versioned packages instead of one:
#
#   1. Land PRs that include a changeset (`npm run changeset`).
#   2. This workflow opens/updates a "Version Packages" PR that applies the
#      version bumps and changelogs.
#   3. Merging that PR triggers this workflow again, which builds (WASM +
#      TypeScript) and publishes every package whose version is new.
#
# Manual dispatch republishes anything missing from the registry without
# needing a new changeset.
#
# FIRST RUN: with no changesets pending, this publishes every non-private
# package at its CURRENT version (0.0.1 today). See docs/RELEASING.md before
# adding the NPM_TOKEN secret — that secret is what arms this workflow.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write # version-bump commits and tags
  pull-requests: write # the "Version Packages" PR
  id-token: write # npm provenance attestation

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changesets needs history to diff against the base branch

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Set up Rust wasm target
        run: |
          rustup target add wasm32-unknown-unknown
          sudo apt-get update && sudo apt-get install -y lld

      - run: npm ci

      - name: Verify before publishing
        run: |
          npm run build
          npm test

      - name: Create version PR or publish
        uses: changesets/action@v1
        with:
          publish: npm run release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
